# The whole app: `docker compose up --build`, then open http://localhost:8000 (README §13).
# For development with live reload use `npm run dev`, which starts only the database from here.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adnario
      POSTGRES_PASSWORD: adnario
      POSTGRES_DB: adnario
    ports: ['127.0.0.1:${DB_PORT:-55622}:5432']
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adnario']
      interval: 2s
      retries: 30

  converter:
    build: apps/converter

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ['${APP_PORT:-8000}:8000']
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql://adnario:adnario@db:5432/adnario
      CONVERTER_URL: http://converter:8100
      FILES_DIR: /data/files
    volumes: [files:/data/files]
    depends_on:
      db: {condition: service_healthy}
      converter: {condition: service_started}

volumes:
  db:
  files:
